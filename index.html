  <head>

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>WA-Chain — The Online School of Washi &amp; Conservation</title>

      name="description"
      content="WA-Chain: the online school of washi and conservation. A structured introduction to the science of Japanese paper and mounting conservation (sōkō), for professional conservators."

    <meta property="og:title" content="WA-Chain — The Online School of Washi &amp; Conservation" />

      property="og:description"
      content="WA-Chain: the online school of washi and conservation. A structured introduction to the science of Japanese paper and mounting conservation (sōkō), for professional conservators."
    />
    <meta name="twitter:card" content="summary" />
    <!-- The home hero is the largest thing on the first screen. On the home
         route only, announce it here so it starts downloading before the app
         script has run (the paths mirror HERO_IMAGE in HubPage.jsx). Other
         routes share this HTML, so a static preload would waste the download. -->
    <script>
      var h = location.hash
      if (h === '' || h === '#' || h === '#/') {
        var l = document.createElement('link')
        l.rel = 'preload'
        l.as = 'image'
        l.imageSrcset = '/images/hero/%E7%B9%8A%E7%B6%AD%E3%82%92%E6%B0%B4%E3%81%AB%E3%81%95%E3%82%89%E3%81%99%E6%A7%98%E5%AD%90.w480.webp 480w, /images/hero/%E7%B9%8A%E7%B6%AD%E3%82%92%E6%B0%B4%E3%81%AB%E3%81%95%E3%82%89%E3%81%99%E6%A7%98%E5%AD%90.w960.webp 960w, /images/hero/%E7%B9%8A%E7%B6%AD%E3%82%92%E6%B0%B4%E3%81%AB%E3%81%95%E3%82%89%E3%81%99%E6%A7%98%E5%AD%90.w1600.webp 1600w'
        l.imageSizes = '100vw'
        l.fetchPriority = 'high'
        document.head.appendChild(l)
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The font CSS is fetched ahead but applied only once it arrives, so
         it never holds up the first paint (display=swap handles the switch). -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" /></noscript>
  </head>
